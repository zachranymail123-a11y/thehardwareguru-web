name: GURU Google & Bing Indexer

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalace balíčků
        run: npm install googleapis @supabase/supabase-js

      - name: Spuštění GOOGLE Indexeru (200 ks)
        run: node scripts/push-index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_JSON_KEY: ${{ secrets.GOOGLE_JSON_KEY }}

      - name: Spuštění BING Indexeru (100 ks)
        run: node scripts/push-bing.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
